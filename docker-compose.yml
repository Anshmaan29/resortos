# Local development only. Production uses managed PostgreSQL (RDS Mumbai) — spec §53, §77.
# `name` pins the compose project: the folder was renamed ("resortos" → "resortos zcode") and the
# project name would otherwise follow it, orphaning the existing containers and volumes.
name: resortos
services:
  postgres:
    image: postgres:16-alpine
    container_name: resortos-postgres
    environment:
      POSTGRES_DB: resortos
      POSTGRES_USER: resortos_migrator
      POSTGRES_PASSWORD: migrator_dev_password
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - resortos_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resortos_migrator -d resortos"]
      interval: 2s
      timeout: 3s
      retries: 30
  # S3-compatible object storage — the same S3 code path as production (spec §52).
  # For phone testing on the LAN, ops/dev-https/setup-lan.sh places mkcert certificates in
  # ops/dev-https/certs/minio so MinIO serves HTTPS.
  minio:
    image: resortos-minio-source:2025-10-15
    build:
      context: ./ops/storage
      target: minio
    container_name: resortos-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: resortos
      MINIO_ROOT_PASSWORD: resortos-dev-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - resortos_minio:/data
      - ./ops/dev-https/certs/minio:/root/.minio/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O- https://localhost:9000/minio/health/ready || wget -q -O- http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: private, versioned buckets for development and tests.
  minio-init:
    image: resortos-mc-source:2025-08-13
    build:
      context: ./ops/storage
      target: mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./ops/storage/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["sh", "/create-buckets.sh", "minio:9000"]

volumes:
  resortos_pgdata:
  resortos_minio:
