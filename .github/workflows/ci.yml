name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RESORTOS_ENV: test
  NEXT_TELEMETRY_DISABLED: '1'
  # Same URLs as local development: PostgreSQL on 5433, MinIO on 9000.
  TEST_DATABASE_URL: postgres://resortos_migrator:migrator_dev_password@localhost:5433/resortos_test
  MIGRATION_DATABASE_URL: postgres://resortos_migrator:migrator_dev_password@localhost:5433/resortos
  DATABASE_URL: postgres://resortos_app:app_dev_password@localhost:5433/resortos

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub secret scanning is not available for this private repository's plan,
      # so every push and PR is scanned with gitleaks across the full history instead.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --verbose --config /repo/.gitleaks.toml

  audit:
    name: Dependency advisories (high and critical block)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      # No `cache: pnpm` here: this job installs nothing, so the pnpm store never exists and the
      # cache-save step would fail the job even though the audit itself passed.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The lockfile is all the gate needs, so nothing is installed and no install script runs.
      - name: Audit the lockfile
        run: node ops/ci/audit.mjs

  test:
    name: Build, typecheck, unit + API (real PostgreSQL) + contrast + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resortos
          POSTGRES_USER: resortos_migrator
          POSTGRES_PASSWORD: migrator_dev_password
          TZ: Asia/Kolkata
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U resortos_migrator -d resortos"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Create database roles and test database
        run: PGPASSWORD=migrator_dev_password psql -h localhost -p 5433 -U resortos_migrator -d resortos -v ON_ERROR_STOP=1 -f db/init/01-roles.sql

      - name: Start MinIO (S3-compatible storage, same code path as production)
        run: bash ops/ci/minio.sh

      # The restore test runs pg_dump/pg_restore against the PostgreSQL 16 service. pg_dump refuses
      # to talk to a newer server, so the client major version is pinned rather than inherited from
      # whatever the runner image happens to ship this month.
      - name: PostgreSQL 16 client tools (for the backup restore test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      - name: Unit, API integration and contrast tests
        run: pnpm test

      - name: Operational regression checks
        run: pnpm --filter @resortos/api exec vitest run --config vitest.audit.config.mts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
