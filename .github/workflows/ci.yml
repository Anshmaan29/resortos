name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RESORTOS_ENV: test
  NEXT_TELEMETRY_DISABLED: '1'
  # Same URLs as local development: PostgreSQL on 5433, MinIO on 9000.
  TEST_DATABASE_URL: postgres://resortos_migrator:migrator_dev_password@localhost:5433/resortos_test
  MIGRATION_DATABASE_URL: postgres://resortos_migrator:migrator_dev_password@localhost:5433/resortos
  DATABASE_URL: postgres://resortos_app:app_dev_password@localhost:5433/resortos

jobs:
  test:
    name: Build, typecheck, unit + API (real PostgreSQL) + contrast + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resortos
          POSTGRES_USER: resortos_migrator
          POSTGRES_PASSWORD: migrator_dev_password
          TZ: Asia/Kolkata
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U resortos_migrator -d resortos"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Create database roles and test database
        run: PGPASSWORD=migrator_dev_password psql -h localhost -p 5433 -U resortos_migrator -d resortos -v ON_ERROR_STOP=1 -f db/init/01-roles.sql

      - name: Start MinIO (S3-compatible storage)
        if: hashFiles('db/init/minio-setup.sh') != ''
        run: bash db/init/minio-setup.sh ci

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      - name: Unit, API integration and contrast tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
